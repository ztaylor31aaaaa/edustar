<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><title>Arcade — Game Library</title><link rel="stylesheet" href="/arcade/style.css"><script src="/arcade/app.js" defer></script></head>
<body><div class="layout" id="app-layout">
<aside class="sidebar"><a class="brand" href="#home" aria-label="Arcade home"><span class="brand-icon">A</span><span>arcade<span class="brand-muted"> hub</span></span></a><p class="nav-caption">LIBRARY</p><button class="nav-link active" data-view="home"><span>⌂</span> Overview</button><button class="nav-link" data-view="games"><span>▦</span> All games <b id="game-count">—</b></button><button class="nav-link" data-view="favourites"><span>☆</span> Favourites</button><button class="nav-link" data-view="recent"><span>◷</span> Recently played</button><div class="sidebar-spacer"></div><p class="nav-caption">PREFERENCES</p><button class="nav-link" data-view="settings"><span>⚙</span> Settings</button><button class="nav-link" data-action="tutorial"><span>?</span> Guided tour</button><div class="sidebar-foot"><span class="online-dot"></span> Catalogue connection</div></aside>
<main class="main"><header class="topbar"><div><span class="crumb">ARCADE HUB</span><span class="crumb-sep">/</span><strong id="view-name">Overview</strong></div><div class="top-actions"><span id="catalogue-status" class="status-label">Connecting…</span><button class="avatar" data-action="account" aria-label="Account">A</button></div></header>
<div class="page" id="page"></div></main></div>
<div class="modal-layer" id="modal-layer" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><span class="brand-icon">A</span><button class="icon-close" data-action="close-modal" aria-label="Close">×</button></div><div id="modal-body"></div><div id="modal-footer" class="modal-footer"></div></section></div>
<div class="spotlight" id="spotlight" hidden></div><section class="tour-box" id="tour-box" hidden><div class="tour-top"><span id="tour-step"></span><button data-action="skip-tour" class="quiet-button">Skip</button></div><h2 id="tour-title"></h2><p id="tour-text"></p><div class="progress"><span id="tour-progress"></span></div><div class="tour-buttons"><button class="button secondary" data-action="tour-back">Back</button><button class="button primary" data-action="tour-next">Next</button></div></section><div id="toast-stack" class="toast-stack" aria-live="polite"></div></body></html>
