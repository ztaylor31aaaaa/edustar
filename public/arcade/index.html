<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffc928"><title>SunsetOS</title><link rel="stylesheet" href="/arcade/style.css"><script src="/arcade/app.js" defer></script></head>
<body><div class="layout" id="app-layout">
<aside class="sidebar"><a class="brand" href="#home"><span class="brand-icon">☀</span><span>sunset<span class="brand-muted">OS</span></span></a><p class="nav-caption">YOUR SPACE</p><button class="nav-link active" data-view="home"><span>⌂</span> Home</button><button class="nav-link" data-view="games"><span>⌕</span> Discover games <b id="game-count">—</b></button><button class="nav-link" data-view="my-library"><span>▦</span> My library</button><button class="nav-link" data-view="favourites"><span>☆</span> Favourites</button><button class="nav-link" data-view="recent"><span>◷</span> Recently played</button><p class="nav-caption">COMMUNITY</p><button class="nav-link" data-view="game-market"><span>✧</span> Game market</button><button class="nav-link" data-view="avatar-market"><span>◇</span> Avatar market</button><button class="nav-link" data-view="profile"><span>◉</span> Profile & stats</button><button class="nav-link" data-view="chat"><span>▤</span> Chat room</button><div class="sidebar-spacer"></div><p class="nav-caption">SYSTEM</p><button class="nav-link" data-view="settings"><span>⚙</span> Personalise</button><button class="nav-link" data-action="fullscreen-app"><span>⛶</span> Fullscreen app</button><div class="sidebar-foot"><span class="online-dot"></span> SunsetOS ready</div></aside>
<main class="main"><header class="topbar"><div><span class="crumb">SUNSETOS</span><span class="crumb-sep">/</span><strong id="view-name">Home</strong></div><div class="top-actions"><span class="coin-pill">✦ <b id="coin-count">0</b> coins</span><span id="catalogue-status" class="status-label">Connecting…</span><button class="avatar" data-action="profile">S</button></div></header><div class="page" id="page"></div></main></div>
<section id="player-shell" class="player-shell" hidden><header class="player-bar"><div class="player-title-wrap"><span class="live-dot"></span><strong id="player-title">Game</strong><span id="player-time" class="player-time">00:00</span></div><div class="player-actions"><button class="player-btn" data-action="player-minimise" title="Minimise">—</button><button class="player-btn" data-action="player-fullscreen" title="Fullscreen">⛶</button><button class="player-btn" data-action="player-reload" title="Reload">↻</button><button class="player-btn close" data-action="player-close" title="Close">×</button></div></header><div class="player-stage"><iframe id="game-frame" allow="fullscreen; autoplay; gamepad" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="SunsetOS game player"></iframe></div><div class="miniplayer-label">GAME PAUSED IN MINI VIEW · RESTORE TO CONTINUE</div></section><button id="restore-player" class="restore-player" data-action="player-restore" hidden>▶ <span id="restore-title">Game running</span> <span>↗</span></button>
<div class="modal-layer" id="modal-layer" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><span class="brand-icon">☀</span><button class="icon-close" data-action="close-modal">×</button></div><div id="modal-body"></div><div id="modal-footer" class="modal-footer"></div></section></div><div id="toast-stack" class="toast-stack" aria-live="polite"></div></body></html>
