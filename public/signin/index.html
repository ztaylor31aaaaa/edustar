<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8dc">
  <meta name="description" content="Sign in to Accelerate My Education.">
  <title>Sign in | Accelerate My Education</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js?v=restore-20261111" defer></script>
<link rel="stylesheet" href="/theme.css?v=theme-20261111b"><script src="/theme.js?v=theme-20261111b" defer></script></head>
<body class="signin-page">
  <header class="site-header">
    <a href="/" class="logo">accelerate<span>my</span>education.</a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/#subjects">Subjects</a>
      <a href="/#about">About</a>
    </nav>
    <a href="/signin/" class="login-button" aria-current="page">Sign in</a>
  </header>

  <main class="signin-main">
    <section class="signin-card">
      <p class="signin-eyebrow">STUDENT ACCESS</p>
      <h1>Welcome back.</h1>
      <p class="signin-description">Enter your class access code to continue.</p>

      <form id="access-form" class="signin-form">
        <label for="access-code">Class access code</label>
        <input id="access-code" type="password" placeholder="Enter your class access code" autocomplete="current-password" required>
        <p id="access-error" class="signin-error" role="alert" hidden>That code wasn't recognised. Try again.</p>
        <button class="signin-submit" type="submit">Continue <span aria-hidden="true">→</span></button>
      </form>

      <a class="signin-home-link" href="/">← Back to home</a>
    </section>
  </main>

  <footer class="signin-footer">
    <p>Accelerate My Education</p>
    <p>Learning resources for students.</p>
  </footer>
</body>
</html>
