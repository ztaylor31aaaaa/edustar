<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8dc">
  <meta name="description" content="Sign in to Accelerate My Education.">
  <title>Sign in | Accelerate My Education</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body class="signin-page">
  <header class="site-header">
    <a href="/" class="logo">accelerate<span>my</span>education.</a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/#subjects">Subjects</a>
      <a href="/#about">About</a>
    </nav>
    <a href="/signin/" class="login-button" aria-current="page">Sign in</a>
  </header>

  <main class="signin-main">
    <section class="signin-card">
      <p class="signin-eyebrow">STUDENT ACCESS</p>
      <h1>Welcome back.</h1>
      <p class="signin-description">Choose the original game portal, or enter your developer code to unlock SunsetOS.</p><div class="signin-choice-grid" style="margin-bottom:24px"><button class="signin-choice" type="button" id="original-portal"><strong>Original game portal</strong><span>Open the original Snubby games without a developer code →</span></button></div>

      <form id="access-form" class="signin-form">
        <label for="access-code">SunsetOS developer code</label>
        <input
          id="access-code"
          type="password"
          placeholder="Paste your developer code"
          autocomplete="current-password"
          required
        >
        <p id="access-error" class="signin-error" role="alert" hidden>
          That code wasn't recognised. Try again.
        </p>
        <button class="signin-submit" type="submit">Continue <span aria-hidden="true">→</span></button>
      </form>

      <a class="signin-home-link" href="/">← Back to home</a>
    </section>
  </main>

  <footer class="signin-footer">
    <p>Accelerate My Education</p>
    <p>Learning resources for students.</p>
  </footer>
</body>
</html>
